[build-system]
requires = ["setuptools >= 80"]
build-backend = "setuptools.build_meta"

[project]
name = "rotlib"
dynamic = ["version"]
authors = [
  { name="Sarit Dutta", email="saridut@gmail.com" },
]
description = "Interconversion between rotation representations."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy >= 2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = [
    "sphinx>=9",
    "myst-parser",
    "numpydoc",
    "pydata-sphinx-theme",
]
dev = [
    "rotlib[test,docs]",
    "tox>=4.21",
    "ruff",
]

[project.urls]
repository = "https://github.com/saridut/rotlib.git"

[tool.setuptools.dynamic]
version = {attr = "rotlib.__version__"}

[tool.ruff]
line-length = 79

[tool.tox]
env_list = ["3.14", "3.13", "3.12", "lint"]

[tool.tox.env_run_base]
extras = ["test"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]

[tool.tox.env.lint]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", { replace = "posargs", default = ["."], extend = true }]]
